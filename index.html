<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
    }

    .playground {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.7) 0, transparent 40%),
        radial-gradient(circle at 80% 30%, rgba(255, 255, 255, 0.5) 0, transparent 35%),
        linear-gradient(180deg, #b8e6ff 0%, #d4f5d4 55%, #a8d98a 100%);
    }

    .cat {
      position: absolute;
      width: 140px;
      height: 160px;
      left: 0;
      top: 0;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.08));
    }

    .cat-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .cat.sitting .tail {
      transform-origin: 108px 118px;
      animation: idle-wag 2.4s ease-in-out infinite;
    }

    .cat.walking .tail,
    .cat.running .tail {
      transform-origin: 108px 118px;
      animation: wag 1.1s ease-in-out infinite;
    }

    @keyframes idle-wag {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(4deg); }
    }

    @keyframes wag {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(10deg); }
    }

    .eyelid {
      transform: scaleY(0);
      transform-origin: center top;
      transform-box: fill-box;
      transition: transform 0.12s ease;
    }

    .cat.blinking .eyelid {
      transform: scaleY(1);
    }

    .pupil,
    .pupil-shine,
    .pupil-shine-small {
      transition: transform 0.12s ease;
    }

    .cat.walking .paw-left {
      animation: step-left 0.45s ease-in-out infinite;
    }

    .cat.walking .paw-right {
      animation: step-right 0.45s ease-in-out infinite;
    }

    .cat.running .paw-left {
      animation: step-left 0.22s ease-in-out infinite;
    }

    .cat.running .paw-right {
      animation: step-right 0.22s ease-in-out infinite;
    }

    @keyframes step-left {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes step-right {
      0%, 100% { transform: translateY(-5px); }
      50% { transform: translateY(0); }
    }

    .cat.running .smile {
      animation: happy-bounce 0.22s ease-in-out infinite;
    }

    @keyframes happy-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(1px); }
    }
  </style>
</head>
<body>
  <div class="playground" id="playground">
    <div class="cat sitting" id="cat">
      <svg class="cat-svg" viewBox="0 0 140 160" aria-hidden="true">
        <path class="tail" d="M108 118 Q138 100 132 72 Q128 52 118 58" fill="none" stroke="#f8c4a8" stroke-width="14" stroke-linecap="round"/>
        <ellipse cx="70" cy="118" rx="38" ry="34" fill="#ffe8d6"/>
        <ellipse cx="70" cy="122" rx="22" ry="20" fill="#fff5ee"/>
        <ellipse class="paw paw-left" cx="48" cy="148" rx="14" ry="9" fill="#ffe8d6"/>
        <ellipse class="paw paw-right" cx="92" cy="148" rx="14" ry="9" fill="#ffe8d6"/>
        <ellipse cx="48" cy="149" rx="8" ry="4" fill="#ffb8c9" opacity="0.6"/>
        <ellipse cx="92" cy="149" rx="8" ry="4" fill="#ffb8c9" opacity="0.6"/>
        <circle cx="70" cy="62" r="44" fill="#ffe8d6"/>
        <path d="M34 38 L28 8 L52 28 Z" fill="#ffe8d6"/>
        <path d="M106 38 L112 8 L88 28 Z" fill="#ffe8d6"/>
        <path d="M36 34 L32 16 L48 28 Z" fill="#ffb8c9"/>
        <path d="M104 34 L108 16 L92 28 Z" fill="#ffb8c9"/>
        <ellipse cx="38" cy="72" rx="10" ry="7" fill="#ffb8c9" opacity="0.55"/>
        <ellipse cx="102" cy="72" rx="10" ry="7" fill="#ffb8c9" opacity="0.55"/>
        <g class="eyes">
          <g class="eye eye-left" transform="translate(48, 58)">
            <ellipse cx="0" cy="0" rx="13" ry="15" fill="#fff"/>
            <circle class="pupil" cx="0" cy="2" r="7" fill="#4a3728"/>
            <circle class="pupil-shine" cx="-2" cy="-1" r="3" fill="#fff"/>
            <circle class="pupil-shine-small" cx="3" cy="4" r="1.5" fill="#fff" opacity="0.8"/>
            <ellipse class="eyelid" cx="0" cy="-8" rx="14" ry="16" fill="#ffe8d6"/>
          </g>
          <g class="eye eye-right" transform="translate(92, 58)">
            <ellipse cx="0" cy="0" rx="13" ry="15" fill="#fff"/>
            <circle class="pupil" cx="0" cy="2" r="7" fill="#4a3728"/>
            <circle class="pupil-shine" cx="-2" cy="-1" r="3" fill="#fff"/>
            <circle class="pupil-shine-small" cx="3" cy="4" r="1.5" fill="#fff" opacity="0.8"/>
            <ellipse class="eyelid" cx="0" cy="-8" rx="14" ry="16" fill="#ffe8d6"/>
          </g>
        </g>
        <ellipse cx="70" cy="78" rx="5" ry="4" fill="#ffb8c9"/>
        <path d="M70 82 Q64 88 58 84" fill="none" stroke="#e89aab" stroke-width="2" stroke-linecap="round"/>
        <path d="M70 82 Q76 88 82 84" fill="none" stroke="#e89aab" stroke-width="2" stroke-linecap="round"/>
        <path class="smile" d="M62 86 Q70 94 78 86" fill="none" stroke="#e89aab" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M28 68 Q18 66 10 62" fill="none" stroke="#e8c4b0" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
        <path d="M28 76 Q16 76 8 76" fill="none" stroke="#e8c4b0" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
        <path d="M112 68 Q122 66 130 62" fill="none" stroke="#e8c4b0" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
        <path d="M112 76 Q124 76 132 76" fill="none" stroke="#e8c4b0" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
      </svg>
    </div>
  </div>

  <script>
    const cat = document.getElementById("cat");
    const playground = document.getElementById("playground");
    const pupils = document.querySelectorAll(".pupil");
    const pupilShines = document.querySelectorAll(".pupil-shine");
    const pupilShinesSmall = document.querySelectorAll(".pupil-shine-small");

    const walkSpeed = 2.2;
    const runSpeed = 5.5;
    const catWidth = 140;
    const catHeight = 160;
    const stopDistance = 6;

    let x = playground.clientWidth / 2 - catWidth / 2;
    let y = playground.clientHeight / 2 - catHeight / 2;
    let cursorX = x + catWidth / 2;
    let cursorY = y + catHeight / 2;
    let cursorInside = false;
    let isRunning = false;
    let facingLeft = false;

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function getCatCenter() {
      return {
        x: x + catWidth / 2,
        y: y + catHeight / 2 + 10,
      };
    }

    function blink() {
      cat.classList.add("blinking");
      setTimeout(() => cat.classList.remove("blinking"), 140);
    }

    function scheduleBlink() {
      const delay = 1800 + Math.random() * 2400;
      setTimeout(() => {
        blink();
        scheduleBlink();
      }, delay);
    }

    function updateEyeDirection() {
      const center = getCatCenter();
      const dx = cursorX - center.x;
      const dy = cursorY - center.y;
      const distance = Math.hypot(dx, dy) || 1;
      let offsetX = (dx / distance) * 4;
      let offsetY = (dy / distance) * 3;

      if (facingLeft) {
        offsetX = -offsetX;
      }

      pupils.forEach((pupil, i) => {
        const transform = `translate(${offsetX}px, ${offsetY}px)`;
        pupil.style.transform = transform;
        if (pupilShines[i]) pupilShines[i].style.transform = transform;
        if (pupilShinesSmall[i]) pupilShinesSmall[i].style.transform = transform;
      });
    }

    function updateCatPosition() {
      const maxX = playground.clientWidth - catWidth;
      const maxY = playground.clientHeight - catHeight;
      const center = getCatCenter();
      let isMoving = false;

      if (cursorInside) {
        const dx = cursorX - center.x;
        const dy = cursorY - center.y;
        const distance = Math.hypot(dx, dy);

        if (distance > stopDistance) {
          const speed = isRunning ? runSpeed : walkSpeed;
          x += (dx / distance) * speed;
          y += (dy / distance) * speed;
          isMoving = true;
        }
      }

      x = clamp(x, 0, maxX);
      y = clamp(y, 0, maxY);

      facingLeft = cursorX < getCatCenter().x;

      cat.style.left = `${x}px`;
      cat.style.top = `${y}px`;
      cat.style.transform = facingLeft ? "scaleX(-1)" : "scaleX(1)";
      cat.classList.toggle("running", isRunning && isMoving);
      cat.classList.toggle("walking", !isRunning && isMoving);
      cat.classList.toggle("sitting", !isMoving);

      updateEyeDirection();
    }

    playground.addEventListener("mousemove", (e) => {
      const rect = playground.getBoundingClientRect();
      cursorX = e.clientX - rect.left;
      cursorY = e.clientY - rect.top;
      cursorInside = true;
    });

    playground.addEventListener("mouseleave", () => {
      cursorInside = false;
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        isRunning = true;
      }
    });

    window.addEventListener("keyup", (e) => {
      if (e.key === "Enter") {
        isRunning = false;
      }
    });

    window.addEventListener("resize", () => {
      const maxX = playground.clientWidth - catWidth;
      const maxY = playground.clientHeight - catHeight;
      x = clamp(x, 0, maxX);
      y = clamp(y, 0, maxY);
    });

    function gameLoop() {
      updateCatPosition();
      requestAnimationFrame(gameLoop);
    }

    updateCatPosition();
    scheduleBlink();
    gameLoop();
  </script>
</body>
</html>
